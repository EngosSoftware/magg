name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - release/**
  pull_request:

env:
  RUST_TOOLCHAIN: 1.88.0

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: '.exe'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run linter
        run: cargo clippy --all-targets -- -D warnings -W clippy::pedantic -W clippy::nursery

      - name: Run tests
        run: cargo test

      - name: Get package name and version
        shell: bash
        id: metadata
        run: |
          NAME=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].name')
          echo "name=$NAME" >> $GITHUB_OUTPUT
          VERSION=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.name }}-v${{ steps.metadata.outputs.version }}-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ steps.metadata.outputs.name }}${{ matrix.ext }}
