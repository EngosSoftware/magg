[package]
name = "magg"
authors = ["Dariusz Depta <depta@engos.de>"]
description = "Opinionated tools for Rust devs"
repository = "https://github.com/EngosSoftware/magg.git"
version = "0.4.4-dev"
license = "MIT OR Apache-2.0"
edition = "2024"
include = [
    "src/**",
    "tests/**",
    "docs/*.rs.md",
    "Cargo.lock",
    "Cargo.toml",
    "LICENSE*",
    "README.md"
]

[dependencies]
antex = "0.2.3"
clap = { version = "4.6.7", features = ["cargo"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
time = "0.3.55"
toml = "1.2.0"

[dev-dependencies]
cli-assert = "0.1.13"
