[package]
name = "magg"
authors = ["Dariusz Depta <depta@engos.de>"]
description = "Sophisticated tooling for Rust developers"
repository = "https://github.com/EngosSoftware/magg.git"
version = "0.4.3-dev"
license = "MIT OR Apache-2.0"
edition = "2024"
exclude = [
    "rustfmt.toml",
    "Taskfile.yml",
    ".github/",
    ".gitignore",
    "CODE_OF_CONDUCT.md",
    "manual/"
]

[lib]
name = "magg"
path = "src/lib.rs"

[[bin]]
name = "magg"
path = "src/main.rs"

[dependencies]
antex = "0.2.3"
clap = { version = "4.6.7", features = ["cargo"] }
regex = "1.13.1"
time = "0.3.55"
toml = "1.2.0"

[dev-dependencies]
cli-assert = "0.1.13"
